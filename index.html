<title>Horizon Holidays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0E2A4A;--navy2:#1B3E66;--ink:#1A2433;--muted:#5A6577;--line:#E1E6EC;--soft:#F3F5F8;--sky:#E5EFF9;--orange:#D9480F;--orange-d:#B33A0A;--gold:#B7700E;--green:#127A5B;--greenbg:#DDF3EA;--red:#B42318;color-scheme:light}
*{box-sizing:border-box}
html,body{background:#fff}
body{color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;color:var(--navy);margin:0;text-wrap:balance;font-weight:700}
a{color:var(--navy2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FB2E5;outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.hidden{display:none!important}
/* header */
.hdr{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;color:var(--navy)}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav button{background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink)}
.nav button:hover{background:var(--soft)}
.nav button.on{color:var(--orange-d);box-shadow:inset 0 -3px 0 var(--orange)}
.who{display:inline-flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--orange);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--orange-d)}
.btn.navy{background:var(--navy)}.btn.navy:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:var(--sky)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--orange-d);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field select,.field textarea{height:48px;border:1.5px solid #C5CED9;border-radius:10px;padding:0 14px;font-weight:400;background:#fff}
.field textarea{height:84px;padding:12px 14px;resize:vertical}
.field input[aria-invalid="true"]{border-color:var(--red);background:#FFF7F6}
.err{color:var(--red);font-size:13px;font-weight:500;min-height:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;background:#fff}
.shadow{box-shadow:0 8px 24px rgba(14,42,74,.08)}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--sky);color:var(--navy)}
.pill.ok{background:var(--greenbg);color:#0B5A43}
.pill.warn{background:#FDEBDD;color:#8A3A0C}
.chip{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12.5px;background:var(--soft);color:#39465A}
.star{color:var(--gold);font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-d)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px)}
footer{margin-top:64px;border-top:1px solid var(--line);background:var(--soft)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px;font-size:14px;color:var(--muted)}
/* login */
.auth{background:var(--soft);min-height:calc(100vh - 69px);display:flex;align-items:center;padding-block:40px}
.authcard{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.authart{position:relative;min-height:540px;background:var(--navy);color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.authart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.authart>*:not(img){position:relative}
.authart h2{color:#fff;font-size:32px}
.authart ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.authart li::before{content:"✓";color:#FFB98F;font-weight:700;margin-right:10px}
.authform{padding:36px 40px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;align-self:center;width:260px}
.seg button{border:0;border-radius:999px;padding:9px;background:transparent;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:46px;border-radius:999px;border:1.5px solid #C5CED9;background:#fff;font-weight:700;cursor:pointer}
.gbtn:hover{background:var(--soft)}
/* home */
.hero{position:relative;border-radius:20px;overflow:hidden;margin-top:24px;min-height:360px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:40px clamp(16px,4vw,48px);background:linear-gradient(#BCD9F3,#E7F1FB 70%,#F5F9FD)}
.hero h1{font-size:clamp(32px,4.6vw,54px);text-align:center;max-width:22ch}
.search{background:#fff;border-radius:999px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:center;padding:8px;box-shadow:0 10px 30px rgba(14,42,74,.14);width:100%;max-width:980px}
.search label{display:flex;flex-direction:column;padding:4px 18px;border-right:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.search label:nth-of-type(4){border-right:0}
.search input,.search select{border:0;padding:2px 0;font-size:15.5px;font-weight:700;color:var(--navy);background:transparent;outline:none;width:100%;letter-spacing:0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:48px 0 18px}
.sechead h2{font-size:30px}
.types{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.type{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font-weight:700;color:var(--navy);font-family:Fraunces,Georgia,serif}
.type img{width:96px;height:96px;border-radius:50%;object-fit:cover;transition:transform .2s}
.type:hover img{transform:scale(1.05);outline:3px solid var(--orange);outline-offset:3px}
.dests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.dest{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.dest img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.dest b{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--navy)}
/* results */
.sbar{background:var(--soft);border-bottom:1px solid var(--line);padding-block:16px}
.sbar .search{max-width:none;box-shadow:none;border:1px solid var(--line)}
.results{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;margin-top:24px}
.filters h3{font-size:12.5px;letter-spacing:.06em;margin:0 0 10px}
.fg{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.fg label{display:flex;gap:10px;align-items:center;cursor:pointer}
.fg input{accent-color:var(--navy);width:17px;height:17px}
.fg input[type=range]{width:100%;accent-color:var(--orange)}
.tcard{display:grid;grid-template-columns:240px minmax(0,1fr) 190px;overflow:hidden;margin-bottom:16px}
.tcard img{width:100%;height:100%;min-height:190px;object-fit:cover}
.tcard .mid{padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.route{font-size:12.5px;letter-spacing:.05em;font-weight:700;color:var(--orange-d);text-transform:uppercase}
.tcard h3{font-size:24px}
.tcard .pr{padding:18px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.amt{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.savebtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--orange);color:var(--orange-d);background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.savebtn[aria-pressed="true"]{background:var(--orange);color:#fff}
.empty{padding:40px;text-align:center}
/* trip */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:170px 170px;gap:10px;margin-top:18px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.gallery .big{grid-row:span 2}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.fact{background:var(--soft);border-radius:12px;padding:12px 14px}
.fact small{display:block;color:var(--muted);font-size:12px}.fact b{color:var(--navy)}
.tripgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px;margin-top:28px;align-items:start}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:12px 0;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--navy);border-color:var(--orange)}
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 22px;border-left:2px solid #F3C7B2;margin-left:6px}
.tl li{position:relative;padding:0 0 16px 8px}
.tl li::before{content:"";position:absolute;left:-30px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--orange)}
.tl b{color:var(--navy)}
.bookbox{padding:24px;display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.lines{display:flex;flex-direction:column;gap:8px;font-variant-numeric:tabular-nums}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .tot{border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-size:18px;color:var(--navy)}
/* booking */
.steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0;list-style:none;padding:0}
.steps li{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:14.5px}
.steps .n{width:30px;height:30px;border-radius:50%;border:2px solid #C5CED9;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.steps li.on{color:var(--navy)}.steps li.on .n{background:var(--orange);border-color:var(--orange);color:#fff}
.steps li.done .n{background:var(--navy);border-color:var(--navy);color:#fff}
.steps .sep{width:36px;height:2px;background:#C5CED9}
.bookgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.sec{padding:24px;display:flex;flex-direction:column;gap:16px;margin-bottom:18px}
.sec h2{font-size:22px}
.addon{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.addon:has(input:checked){border-color:var(--navy);background:var(--sky)}
.addon input{accent-color:var(--navy);width:18px;height:18px;margin-top:3px}
.addon .t{flex:1}.addon small{display:block;color:var(--muted);font-weight:400}
.summary{overflow:hidden;position:sticky;top:90px}
.summary img{width:100%;height:140px;object-fit:cover}
.confirm{text-align:center;max-width:620px;margin:48px auto;padding:40px}
.tick{width:72px;height:72px;border-radius:50%;background:var(--greenbg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px}
/* account */
.acct{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;margin-top:28px}
.side{background:var(--soft);border-radius:16px;padding:22px 16px;display:flex;flex-direction:column;gap:4px;align-self:start}
.side button{text-align:left;background:none;border:0;padding:11px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.side button[aria-current="page"]{background:#DCEAF7;color:var(--navy);font-weight:700}
.welcome{position:relative;border-radius:18px;overflow:hidden;min-height:200px;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;gap:10px;color:#fff;background:var(--navy)}
.welcome img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.welcome>*:not(img){position:relative}
.welcome h1{color:#fff;font-size:34px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.stat{padding:14px 16px;display:flex;gap:12px;align-items:center}
.stat .ic{width:40px;height:40px;border-radius:50%;background:#FDEBDD;color:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:700}
.stat b{font-family:Fraunces,Georgia,serif;font-size:24px;color:var(--navy);display:block;line-height:1.1}
.stat small{color:var(--muted);font-size:13px}
.upc{display:grid;grid-template-columns:280px minmax(0,1fr);overflow:hidden;margin-top:16px}
.upc img{width:100%;height:100%;min-height:220px;object-fit:cover}
.bar{height:8px;background:#EEF1F4;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
.mini .card{overflow:hidden;text-align:left;padding:0;cursor:pointer}
.mini img{width:100%;height:130px;object-fit:cover}
.mini .t{padding:12px 14px}
@media (max-width:920px){
.authcard,.results,.tripgrid,.bookgrid,.acct{grid-template-columns:1fr}
.authart{min-height:260px}
.search{grid-template-columns:1fr 1fr;border-radius:18px;gap:4px}
.search label{border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
.search .btn{grid-column:span 2}
.types{grid-template-columns:repeat(3,minmax(0,1fr))}
.dests,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.tcard,.upc{grid-template-columns:1fr}
.tcard .pr{border-left:0;border-top:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
.gallery{grid-template-columns:1fr 1fr;grid-template-rows:200px 120px}
.gallery .big{grid-column:span 2;grid-row:auto}.gallery .x{display:none}
.bookbox,.summary{position:static}
.mini{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.grid2,.mini{grid-template-columns:1fr}.authform{padding:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="hdr" id="hdr">
  <div class="wrap">
    <button class="brand" type="button" data-go="home" aria-label="Horizon Holidays home">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E8912D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="4"/><path d="M12 3v3M4.2 6.2l2 2M19.8 6.2l-2 2M2 13h3M19 13h3M3 19h18"/></svg>
      Horizon Holidays
    </button>
    <nav class="nav" id="nav" aria-label="Main">
      <button type="button" data-go="home" data-nav="home">Home</button>
      <button type="button" data-go="results" data-nav="results">Search trips</button>
      <button type="button" data-go="trip" data-nav="trip">Trip details</button>
      <button type="button" data-go="account" data-nav="account" class="who"><span class="av" id="navAv">RK</span>My account</button>
    </nav>
  </div>
</header>

<main id="app"></main>
<div class="toast hidden" id="toast" role="status"></div>

/* ---------- RESULTS ---------- */
function filtered(){
  let r=TRIPS.filter(t=>(S.q.where==='Anywhere'||t.region===S.q.where)&&t.price<=+S.q.budget
   &&(!S.f.types.size||S.f.types.has(t.type))&&(!S.f.style||t.style===S.f.style)
   &&(!S.f.dur||(S.f.dur==='s'?t.days<=7:S.f.dur==='m'?t.days>=8&&t.days<=10:t.days>=11))
   &&[...S.f.inc].every(i=>t.inc.includes(i))&&t.rating>=S.f.rating);
  if(S.sort==='low')r.sort((a,b)=>a.price-b.price);if(S.sort==='high')r.sort((a,b)=>b.price-a.price);if(S.sort==='rating')r.sort((a,b)=>b.rating-a.rating);
  return r}

   <div class="fg"><h3>DURATION</h3>${[['','Any length'],['s','Up to 7 days'],['m','8–10 days'],['l','11+ days']].map(([v,l])=>`<label><input type="radio" name="dur" data-f="dur" value="${v}" ${S.f.dur===v?'checked':''}>${l}</label>`).join('')}</div>

   <div class="fg"><h3>INCLUDES</h3>${['Flights','Trains','Guide','Hotels','Activities'].map(i=>cb(S.f.inc,i,'inc')).join('')}</div>
   <div class="fg" style="border:0"><h3>RATING</h3>${[[0,'Any rating'],[4.7,'★ 4.7 & up'],[4.8,'★ 4.8 & up']].map(([v,l])=>`<label><input type="radio" name="rating" data-f="rating" value="${v}" ${S.f.rating==v?'checked':''}>${l}</label>`).join('')}</div>
  </aside>

    <label for="sort" style="display:flex;gap:8px;align-items:center;font-size:14px" class="muted">Sort by<select id="sort" style="border:1.5px solid #C5CED9;border-radius:10px;padding:7px 10px;font-weight:700;color:var(--navy);background:#fff">${[['best','Best match'],['low','Price: low to high'],['high','Price: high to low'],['rating','Top rated']].map(([v,l])=>`<option value="${v}" ${S.sort===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
   ${r.length?r.map(t=>`<article class="card shadow tcard"><img src="${IMG[t.img]}" alt="">
    <div class="mid">${t.spots<=5?`<span class="pill warn" style="align-self:flex-start">Only ${t.spots} spots left</span>`:t.rating>=4.8?`<span class="pill" style="align-self:flex-start">Top rated</span>`:''}
     <span class="route">${t.route.join(' → ')}</span><h3>${t.title}</h3>
     <span class="muted" style="font-size:14px">${t.days} days · ${t.style} · <span class="star">★ ${t.rating}</span> (${t.reviews} reviews)</span>

     <button type="button" class="savebtn" data-save="${t.id}" aria-pressed="${S.saved.has(t.id)}">${S.saved.has(t.id)?'♥ Saved':'♡ Save'}</button>

function trip(){
  const t=T(S.trip),sub=t.price*S.travellers,tax=Math.round(sub*.05);
  const tabs={itin:`<ol class="tl">${t.itin.map(([d,a,b])=>`<li><b>${d} – ${a}</b><div class="muted" style="font-size:14.5px">${b}</div></li>`).join('')}</ol>`,
   inc:`<div class="grid2" style="margin-top:18px"><div class="card" style="padding:18px"><b style="color:var(--green)">✓ Included</b><ul style="margin:8px 0 0;padding-left:18px;line-height:1.9">${t.inc.map(i=>`<li>${i}</li>`).join('')}</ul></div><div class="card" style="padding:18px;background:var(--soft)"><b class="muted">✗ Not included</b><ul class="muted" style="margin:8px 0 0;padding-left:18px;line-height:1.9"><li>Visas</li><li>Most meals</li><li>Personal spending</li></ul></div></div>`,
   rev:`<div class="grid2" style="margin-top:18px">${[['Priya S.',5,'Everything was organised. The best trip I have taken.'],['Daniel M.',4,'Great guide and a good mix of tours and free time.'],['Aisha K.',5,'Easy to book and every transfer was on time.'],['Tom R.',4,'Busy days but worth it. Would book again.']].map(([n,s,q])=>`<div class="card" style="padding:16px"><b>${n}</b> <span class="star">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span><p style="margin:6px 0 0;font-size:14.5px">${q}</p></div>`).join('')}</div>`};
  return `<div class="wrap" style="padding-top:18px">
  <button class="link" type="button" data-go="results">← Back to results</button>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:10px">
   <div><span class="eyebrow">${t.region} · ${t.type}</span><h1 style="font-size:clamp(30px,4vw,46px)">${t.title}</h1><span class="muted">${t.route.join(' → ')} · ${t.days} days · <span class="star">★ ${t.rating}</span> (${t.reviews} reviews)</span></div>
   <div style="display:flex;gap:10px"><button type="button" class="btn ghost sm" id="share">Share</button><button type="button" class="savebtn" data-save="${t.id}" aria-pressed="${S.saved.has(t.id)}">${S.saved.has(t.id)?'♥ Saved':'♡ Save trip'}</button></div></div>
  <div class="gallery"><img class="big" src="${IMG[t.gal[0]]}" alt="">${t.gal.slice(1).map((g,i)=>`<img class="${i%2?'x':''}" src="${IMG[g]}" alt="">`).join('')}</div>
  <div class="facts"><div class="fact"><small>Duration</small><b>${t.days} days</b></div><div class="fact"><small>Group size</small><b>${t.style==='Private tour'?'Just you':t.style==='Self-guided'?'Your group':'Max 16 people'}</b></div><div class="fact"><small>Style</small><b>${t.style}</b></div><div class="fact"><small>Transport</small><b>${t.inc.includes('Trains')?'Train + flights':t.inc.includes('Rental car')?'Car + flights':'Flights + transfers'}</b></div></div>
  <div class="tripgrid"><div>
   <h2 style="font-size:26px;margin-bottom:8px">Overview</h2><p style="margin:0 0 24px;max-width:65ch">${t.overview}</p>

   ${tabs[S.tab]}</div>
  <aside class="card shadow bookbox" aria-label="Book this trip">
   <div><span class="amt" style="font-size:32px">${money(t.price)}</span> <span class="muted">per person</span></div>
   <label class="field" for="tdate">Departure date<select id="tdate">${['2027-06-10','2027-07-08','2027-08-12','2027-09-09'].map(d=>`<option value="${d}" ${S.date===d?'selected':''}>${fmt(d)}</option>`).join('')}</select></label>
   <label class="field" for="ttrav">Travellers<select id="ttrav">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${S.travellers===n?'selected':''}>${n} adult${n>1?'s':''}</option>`).join('')}</select></label>
   <div class="lines"><div><span>${money(t.price)} × ${S.travellers}</span><span>${money(sub)}</span></div><div><span>Taxes &amp; fees</span><span>${money(tax)}</span></div><div class="tot"><span>Total (CAD)</span><span>${money(sub+tax)}</span></div></div>

const fmt=d=>new Date(d+'T12:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
const fmtRange=(d,n)=>{const a=new Date(d+'T12:00'),b=new Date(a);b.setDate(b.getDate()+n-1);return a.toLocaleDateString('en-CA',{month:'short',day:'numeric'})+' – '+b.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})};

/* ---------- BOOKING ---------- */
const ADDONS=[['ins','Travel insurance','Medical and cancellation cover',79,true],['pick','Airport pickup & drop-off','Private car both ways',60,false],['act','Extra day trip','One guided excursion of your choice',95,true]];
function totals(){const t=T(S.trip),sub=t.price*S.travellers;const a=S.booking.addons||{};let add=0;ADDONS.forEach(([k,,,p,pp])=>{if(a[k])add+=pp?p*S.travellers:p});const tax=Math.round((sub+add)*.05);return{sub,add,tax,total:sub+add+tax}}
function booking(){
  const t=T(S.trip),st=S.bookStep,tt=totals(),b=S.booking,u=S.user;
  const steps=['Travellers','Add-ons','Payment','Confirmation'];
  const stepper=`<ol class="steps" aria-label="Booking progress">${steps.map((s,i)=>`${i?'<li class="sep" aria-hidden="true"></li>':''}<li class="${i+1===st?'on':i+1<st?'done':''}" ${i+1===st?'aria-current="step"':''}><span class="n">${i+1<st?'✓':i+1}</span>${s}</li>`).join('')}</ol>`;
  if(st===4){const bk=S.bookings[0];return `<div class="wrap">${stepper}<div class="card shadow confirm"><div class="tick">✓</div><h1 style="font-size:34px">You're going on a trip!</h1>
   <p class="muted">Booking reference <b style="color:var(--navy)">${bk.id}</b>. A confirmation would be emailed to ${esc(u.email)} on a live site.</p>
   <div class="lines" style="text-align:left;margin:22px 0"><div><span>${t.title}</span><span>${fmtRange(bk.date,t.days)}</span></div><div><span>Travellers</span><span>${bk.travellers}</span></div><div class="tot"><span>Total paid (CAD)</span><span>${money(bk.total)}</span></div></div>
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn navy" type="button" data-go="account" data-acct="trips">View in My trips</button><button class="btn ghost" type="button" data-go="results">Find another trip</button></div></div></div>${footer}`}

  const trav=`<div class="card sec"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Lead traveller</h2><span class="pill">Filled in from My account</span></div>
   <div class="grid2">
    ${fld('fn','First name',b.fn??nm[0]??'')}${fld('ln','Last name',b.ln??nm.slice(1).join(' '))}
    ${fld('bem','Email',b.bem??u.email,'email')}${fld('ph','Phone',b.ph??u.phone??'','tel','+1 604 555 0142')}
    ${fld('dob','Date of birth',b.dob??u.dob??'','date')}${fld('pp','Passport number',b.pp??'','text','As shown on passport')}
   </div></div>
   ${S.travellers>1?Array.from({length:S.travellers-1},(_,i)=>`<div class="card sec"><h2>Traveller ${i+2}</h2><div class="grid2">${fld('t'+i+'f','First name',b['t'+i+'f']??'')}${fld('t'+i+'l','Last name',b['t'+i+'l']??'')}</div></div>`).join(''):''}`;
  const add=`<div class="card sec"><h2>Trip add-ons</h2><p class="muted" style="margin:-8px 0 0">Optional. You can add these later from My account.</p>
   ${ADDONS.map(([k,n,d,p,pp])=>`<label class="addon"><input type="checkbox" data-addon="${k}" ${(b.addons||{})[k]?'checked':''}><span class="t"><b>${n}</b><small>${d}</small></span><b>+${money(p)}${pp?' pp':''}</b></label>`).join('')}
   <label class="field" for="req">Special requests (optional)<textarea id="req" placeholder="Dietary needs, accessibility, celebrations">${esc(b.req||'')}</textarea></label></div>`;
  const pay=`<div class="card sec"><h2>Payment</h2><p class="muted" style="margin:-8px 0 0">Prototype only. Use any test numbers; no real payment is taken.</p>
   ${fld('cn','Name on card',b.cn??u.name)}${fld('cc','Card number',b.cc??'','text','4242 4242 4242 4242')}
   <div class="grid2">${fld('ex','Expiry (MM/YY)',b.ex??'','text','08/29')}${fld('cv','CVC',b.cv??'','text','123')}</div>
   <label style="display:flex;gap:10px;align-items:flex-start;font-size:14.5px"><input id="agree" type="checkbox" ${b.agree?'checked':''} style="accent-color:var(--navy);width:18px;height:18px;margin-top:2px">I agree to the terms and cancellation policy</label><span class="err" id="e-agree"></span></div>`;
  const a=b.addons||{};
  return `<div class="wrap"><button class="link" type="button" style="margin-top:18px" id="bookBack">← ${st===1?'Back to trip':'Back'}</button>${stepper}
  <div class="bookgrid"><form id="bookForm" novalidate>${[trav,add,pay][st-1]}
   <div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn" type="submit">${st===3?'Pay '+money(tt.total)+' and book':'Continue →'}</button></div></form>
  <aside class="card shadow summary"><img src="${IMG[t.img]}" alt=""><div style="padding:20px;display:flex;flex-direction:column;gap:12px">
   <h3 style="font-size:22px">${t.title}</h3><span class="muted" style="font-size:14px">${fmtRange(S.date,t.days)} · ${S.travellers} traveller${S.travellers>1?'s':''}</span>
   <div class="lines"><div><span>Trip × ${S.travellers}</span><span>${money(tt.sub)}</span></div>
    ${ADDONS.filter(([k])=>a[k]).map(([k,n,,p,pp])=>`<div><span>${n}</span><span>${money(pp?p*S.travellers:p)}</span></div>`).join('')}
    <div><span>Taxes &amp; fees</span><span>${money(tt.tax)}</span></div><div class="tot"><span>Total (CAD)</span><span>${money(tt.total)}</span></div></div></div></aside>
  </div></div>${footer}`}
function fld(id,label,val,type='text',ph=''){return `<label class="field" for="${id}">${label}<input id="${id}" type="${type}" value="${esc(val||'')}" placeholder="${ph}"><span class="err" id="e-${id}"></span></label>`}

/* ---------- ACCOUNT ---------- */
function account(){
  const u=S.user,tab=S.acctTab;
  const nav=[['trips','My trips'],['saved',`Saved trips (${S.saved.size})`],['profile','Profile details'],['pay','Payment methods'],['set','Settings']];
  let body='';
  if(tab==='trips'){
    const up=S.bookings.filter(b=>b.status!=='Cancelled');const nx=up[0];
    const days=nx?Math.max(0,Math.round((new Date(nx.date+'T12:00')-new Date())/864e5)):0;
    body=`<div class="welcome"><img src="${IMG.sea}" alt=""><h1>Welcome back, ${esc(u.name.split(' ')[0])} ✈</h1><p style="margin:0;opacity:.9">${nx?`Your next adventure starts in ${days} days.`:'No trips booked yet. Where to next?'}</p><button class="btn ghost sm" type="button" data-go="results" style="align-self:flex-start;border:0">Plan a new trip</button></div>
    <div class="stats">${[['✈',S.bookings.length+S.past.length,'Trips booked'],['◉',7,'Countries visited'],['♥',S.saved.size,'Saved trips'],['★',(1250+S.bookings.length*150).toLocaleString(),'Reward points']].map(([i,n,l])=>`<div class="card stat"><span class="ic">${i}</span><div><b>${n}</b><small>${l}</small></div></div>`).join('')}</div>
    <h2 style="font-size:30px;margin-top:28px">My trips</h2>
    <div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true">Upcoming (${up.length})</button><button type="button" role="tab" aria-selected="false" id="pastTab">Past (${S.past.length})</button></div>
    ${up.length?up.map(bk=>{const t=T(bk.trip);const pct=Math.max(8,100-Math.round(Math.max(0,(new Date(bk.date+'T12:00')-new Date())/864e5)/365*100));return `<article class="card shadow upc"><img src="${IMG[t.img]}" alt=""><div style="padding:20px 24px;display:flex;flex-direction:column;gap:8px">
     <span class="pill ok" style="align-self:flex-start">${bk.status}</span><h3 style="font-size:24px">${t.title}</h3>
     <span class="muted" style="font-size:14px">${fmtRange(bk.date,t.days)} · ${bk.travellers} traveller${bk.travellers>1?'s':''} · Ref ${bk.id}</span>
     <div style="display:flex;align-items:center;gap:12px"><b style="color:var(--orange-d);font-size:14px;white-space:nowrap">${Math.round((new Date(bk.date+'T12:00')-new Date())/864e5)} days to go</b><div class="bar" style="flex:1"><i style="width:${pct}%"></i></div></div>
     <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;justify-content:flex-end"><button class="btn ghost sm" type="button" data-cancel="${bk.id}">Cancel booking</button><button class="btn navy sm" type="button" data-view="${t.id}">View itinerary</button></div></div></article>`}).join('')
    :`<div class="card empty" style="margin-top:16px"><p class="muted">No upcoming trips.</p><button class="btn" type="button" data-go="results">Search trips</button></div>`}
    <h2 style="font-size:24px;margin-top:28px">Past trips</h2>
    <div class="mini">${S.past.map(id=>{const t=T(id);return `<button type="button" class="card" data-review="${id}"><img src="${IMG[t.img]}" alt=""><div class="t"><b style="color:var(--navy)">${t.title}</b><div style="font-size:13px;color:var(--orange-d);font-weight:700">★ Leave a review</div></div></button>`}).join('')}</div>`}
  if(tab==='saved'){const sv=[...S.saved].map(T);
    body=`<h1 style="font-size:34px">Saved trips</h1><p class="muted">Trips you saved while searching. Open one to book it.</p>
    ${sv.length?`<div class="mini">${sv.map(t=>`<div class="card"><img src="${IMG[t.img]}" alt=""><div class="t" style="display:flex;flex-direction:column;gap:6px"><b style="color:var(--navy)">${t.title}</b><span class="muted" style="font-size:13px">${t.days} days · ${money(t.price)} pp</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-view="${t.id}">View trip</button><button class="savebtn" type="button" data-save="${t.id}" aria-pressed="true">♥ Remove</button></div></div></div>`).join('')}</div>`
    :`<div class="card empty"><p class="muted">You haven't saved any trips yet.</p><button class="btn" type="button" data-go="results">Search trips</button></div>`}`}
  if(tab==='profile'){
    body=`<h1 style="font-size:34px">Profile details</h1><p class="muted">These details fill in your booking forms automatically.</p>
    <form id="profForm" class="card sec" style="margin-top:12px" novalidate>
     <div style="display:flex;align-items:center;gap:14px"><span class="av" style="width:64px;height:64px;font-size:22px">${initials(u.name)}</span><div><b>${esc(u.name)}</b><div class="muted" style="font-size:14px">Member since 2026</div></div></div>
     <div class="grid2">${fld('pn','Full name',u.name)}${fld('pe','Email',u.email,'email')}${fld('pph','Phone',u.phone||'','tel','+1 604 555 0142')}${fld('pdob','Date of birth',u.dob||'','date')}</div>
     <label class="field" for="pc">Home country<select id="pc">${['Canada','United States','India','United Kingdom'].map(c=>`<option ${u.country===c?'selected':''}>${c}</option>`).join('')}</select></label>
     <div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn" type="submit">Save changes</button></div></form>`}
  if(tab==='pay')body=`<h1 style="font-size:34px">Payment methods</h1><div class="card sec" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><b>Visa ending 4242</b><div class="muted" style="font-size:14px">Expires 08/29 · Default</div></div><span class="pill">Test card</span></div></div><button class="btn ghost" type="button" id="addCard">+ Add a card</button>`;
  if(tab==='set')body=`<h1 style="font-size:34px">Settings</h1><div class="card sec" style="margin-top:12px">${[['Email me trip reminders',true],['Deals and offers',false],['Two-step sign in',false]].map(([l,c],i)=>`<label style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span>${l}</span><input type="checkbox" ${c?'checked':''} style="accent-color:var(--navy);width:20px;height:20px" data-setting="${i}"></label>`).join('')}</div>`;
  return `<div class="wrap"><div class="acct"><aside class="side" aria-label="Account menu">
   <div style="display:flex;gap:12px;align-items:center;margin:0 6px 14px"><span class="av" style="width:46px;height:46px">${initials(u.name)}</span><div><b>${esc(u.name)}</b><div class="muted" style="font-size:13px">Member since 2026</div></div></div>
   ${nav.map(([k,l])=>`<button type="button" data-acct="${k}" ${tab===k?'aria-current="page"':''}>${l}</button>`).join('')}
   <div style="border-top:1px solid #D5DBE3;margin:10px 14px"></div><button type="button" id="signout">Sign out</button></aside>
  <section>${body}</section></div></div>${footer}`}

/* ---------- EVENTS ---------- */
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function setErr(id,msg){const i=document.getElementById(id),e=document.getElementById('e-'+id);if(i)i.setAttribute('aria-invalid',msg?'true':'false');if(e)e.textContent=msg||'';return !msg}
function readSearch(id){S.q.where=$('#'+id+'-w').value;S.q.when=$('#'+id+'-d').value;S.q.who=$('#'+id+'-p').value;S.q.budget=+$('#'+id+'-b').value;S.travellers=+S.q.who}
function bind(){
  document.querySelectorAll('#app [data-go], #hdr [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.acct?{acctTab:b.dataset.acct}:{}));
  document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{S.authTab=b.dataset.auth;render()});
  const af=$('#authForm');
  if(af){
    af.querySelectorAll('input').forEach(i=>i.oninput=()=>setErr(i.id,''));
    af.onsubmit=e=>{e.preventDefault();const up=S.authTab==='signup';let ok=true;
      const em=$('#em').value.trim(),pw=$('#pw').value;
      if(up)ok=setErr('nm',$('#nm').value.trim()?'':'Enter your name')&&ok;
      ok=setErr('em',!em?'Enter your email':!EMAIL.test(em)?'Enter an email like name@example.com':'')&&ok;
      ok=setErr('pw',!pw?'Enter your password':pw.length<6?'Use at least 6 characters':'')&&ok;
      if(up)ok=setErr('pw2',$('#pw2').value!==pw?'Passwords do not match':'')&&ok;
      if(!ok)return;
      const name=up?$('#nm').value.trim():(em.split('@')[0].replace(/[._\d]+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase())||'Traveller');
      S.user={name,email:em,country:'Canada'};$('#pw').value='';
      toast(up?'Account created. Welcome to Horizon Holidays!':'Signed in as '+em);go('home')};
    $('#gbtn').onclick=()=>{S.user={name:'Rk Sidhu',email:'rk.demo@gmail.com',country:'Canada'};toast('Signed in with Google (demo)');go('home')};
    const f=$('#forgot');if(f)f.onclick=()=>{const em=$('#em').value.trim();if(!EMAIL.test(em)){setErr('em','Enter your email first, then click Forgot password');$('#em').focus();return}toast('Reset link sent to '+em+' (demo)')};
  }
  ['hs','rs'].forEach(id=>{const f=document.getElementById(id);if(f)f.onsubmit=e=>{e.preventDefault();readSearch(id);go('results')}});
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.f.types=new Set([b.dataset.type]);S.q.where='Anywhere';S.q.budget=99999;go('results')});
  document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{S.q.where=b.dataset.region;S.q.budget=99999;S.f.types.clear();go('results')});
  document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{const k=i.dataset.f;
    if(k==='types'||k==='inc'){i.checked?S.f[k].add(i.value):S.f[k].delete(i.value)}else S.f[k]=k==='rating'?+i.value:i.value;render()});
  const pr=$('#price');if(pr){pr.oninput=()=>{$('#priceOut').textContent=money(+pr.value)};pr.onchange=()=>{S.q.budget=+pr.value;render()}}
  const so=$('#sort');if(so)so.onchange=()=>{S.sort=so.value;render()};
  ['#clearF','#clearF2'].forEach(s=>{const c=$(s);if(c)c.onclick=()=>{S.f={types:new Set(),style:'',dur:'',inc:new Set(),rating:0};S.q.where='Anywhere';S.q.budget=99999;render()}});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const id=b.dataset.save;if(S.saved.has(id)){S.saved.delete(id);toast('Removed from saved trips')}else{S.saved.add(id);toast('Saved. Find it in My account → Saved trips')}render()});
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go('trip',{trip:b.dataset.view,tab:'itin'}));
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  const td=$('#tdate');if(td)td.onchange=()=>{S.date=td.value;render()};
  const tt=$('#ttrav');if(tt)tt.onchange=()=>{S.travellers=+tt.value;render()};
  const sh=$('#share');if(sh)sh.onclick=async()=>{try{await navigator.clipboard.writeText('horizonholidays.ca/trips/'+S.trip);toast('Trip link copied')}catch(e){toast('Link: horizonholidays.ca/trips/'+S.trip)}};
  const bn=$('#bookNow');if(bn)bn.onclick=()=>go('booking',{bookStep:1,booking:{addons:{ins:true}}});
  const bb=$('#bookBack');if(bb)bb.onclick=()=>{saveBook();if(S.bookStep===1)go('trip');else{S.bookStep--;render();scrollTo(0,0)}};
  document.querySelectorAll('[data-addon]').forEach(i=>i.onchange=()=>{saveBook();S.booking.addons=S.booking.addons||{};S.booking.addons[i.dataset.addon]=i.checked;render()});
  const bf=$('#bookForm');
  if(bf){bf.querySelectorAll('input').forEach(i=>i.oninput=()=>setErr(i.id,''));
    bf.onsubmit=e=>{e.preventDefault();saveBook();let ok=true;const req=(id,m)=>{ok=setErr(id,($('#'+id).value||'').trim()?'':m)&&ok};
     if(S.bookStep===1){req('fn','Enter a first name');req('ln','Enter a last name');const v=$('#bem').value.trim();ok=setErr('bem',EMAIL.test(v)?'':'Enter a valid email')&&ok;req('pp','Enter a passport number');for(let i=0;i<S.travellers-1;i++){req('t'+i+'f','Enter a first name');req('t'+i+'l','Enter a last name')}}
     if(S.bookStep===3){req('cn','Enter the name on the card');const cc=$('#cc').value.replace(/\s/g,'');ok=setErr('cc',/^\d{16}$/.test(cc)?'':'Enter a 16-digit card number')&&ok;ok=setErr('ex',/^(0[1-9]|1[0-2])\/\d{2}$/.test($('#ex').value.trim())?'':'Use MM/YY')&&ok;ok=setErr('cv',/^\d{3,4}$/.test($('#cv').value.trim())?'':'3 or 4 digits')&&ok;
       const ag=$('#agree').checked;$('#e-agree').textContent=ag?'':'Please accept the terms to continue';ok=ok&&ag}
     if(!ok){const f=bf.querySelector('[aria-invalid="true"]');if(f)f.focus();return}
     if(S.bookStep===3){S.bookings.unshift({id:'HH-'+Math.floor(10000+Math.random()*89999),trip:S.trip,date:S.date,travellers:S.travellers,total:totals().total,status:'Confirmed'})}
     S.bookStep++;render();scrollTo(0,0)}}
  document.querySelectorAll('[data-acct]').forEach(b=>{if(!b.dataset.go)b.onclick=()=>{S.acctTab=b.dataset.acct;render()}});
  const so2=$('#signout');if(so2)so2.onclick=()=>{S.user=null;S.authTab='signin';toast('Signed out');go('login')};
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{if(b.dataset.armed){const bk=S.bookings.find(x=>x.id===b.dataset.cancel);bk.status='Cancelled';S.bookings=S.bookings.filter(x=>x!==bk);toast('Booking '+bk.id+' cancelled');render()}else{b.dataset.armed=1;b.textContent='Click again to confirm';b.style.borderColor='var(--red)';b.style.color='var(--red)'}});
  document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>toast('Thanks! Review form for '+T(b.dataset.review).title+' would open here.'));
  const pt=$('#pastTab');if(pt)pt.onclick=()=>document.querySelector('.mini').scrollIntoView({behavior:'smooth'});
  const pf=$('#profForm');if(pf){pf.onsubmit=e=>{e.preventDefault();const em=$('#pe').value.trim();if(!setErr('pn',$('#pn').value.trim()?'':'Enter your name')|!setErr('pe',EMAIL.test(em)?'':'Enter a valid email'))return;Object.assign(S.user,{name:$('#pn').value.trim(),email:em,phone:$('#pph').value,dob:$('#pdob').value,country:$('#pc').value});toast('Profile saved');render()}}
  const ac=$('#addCard');if(ac)ac.onclick=()=>toast('Card form would open here (prototype)');
  document.querySelectorAll('[data-setting]').forEach(i=>i.onchange=()=>toast('Setting saved'));
}
function saveBook(){const f=$('#bookForm');if(!f)return;f.querySelectorAll('input,textarea').forEach(i=>{if(i.id&&i.type!=='checkbox')S.booking[i.id]=i.value});const ag=$('#agree');if(ag)S.booking.agree=ag.checked}
render();
</script>
